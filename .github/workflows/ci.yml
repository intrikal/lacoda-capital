# ─────────────────────────────────────────────────────────────────────────────
# .github/workflows/ci.yml
#
# WHAT IS THIS FILE?
# ──────────────────
# This is a GitHub Actions workflow. GitHub Actions is a built-in automation
# system inside GitHub. Whenever something happens in the repo (a PR opened,
# a push made, etc.), GitHub reads this file and runs the instructions inside
# it on a fresh cloud computer.
#
# Think of it as a checklist that GitHub runs automatically so no human has to
# remember to lint, type-check, test, and build before merging.
#
# WHY DO WE NEED IT?
# ──────────────────
# Without this, every developer has to manually run these checks on their
# machine before merging. People forget. Machines don't.
# Branch protection (configured separately in GitHub Settings) will block a
# PR from merging until ALL five jobs below go green — so bad code literally
# cannot land in main.
#
# HOW TO READ THIS FILE
# ─────────────────────
# YAML is a config language that uses indentation (spaces) to show structure.
# The top level has two keys: `on` (when to run) and `jobs` (what to run).
# Under `jobs` you define one or more jobs. Jobs run IN PARALLEL by default
# unless you add a `needs:` dependency between them.
#
# PSEUDOCODE of what this whole file does:
#
#   WHEN a pull request is opened (or updated) targeting the `main` branch:
#     Spin up 5 fresh Ubuntu machines IN PARALLEL, each running one job:
#       [typecheck]       → tsc --noEmit
#       [lint]            → eslint
#       [test]            → vitest --project unit
#       [build]           → next build (with dummy env vars)
#       [migration-check] → drizzle-kit check
#     IF all 5 pass → PR gets a green checkmark and can be merged
#     IF any fail   → PR gets a red X and is blocked from merging
#
# REQUIRED STATUS CHECKS (configure once in GitHub repo settings):
#   GitHub repo → Settings → Branches → main → Branch protection rules →
#   "Require status checks to pass before merging" → add all 5 job names:
#     CI / typecheck
#     CI / lint
#     CI / test
#     CI / build
#     CI / migration-check
#
# ─────────────────────────────────────────────────────────────────────────────

name: CI

# ── TRIGGER ──────────────────────────────────────────────────────────────────
# Fires on direct pushes to `main` and on any PR targeting `main`.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# ── SHARED SETUP (referenced via YAML anchors would be ideal, but GHA doesn't
#    support anchors — so each job repeats the 3-step checkout/node/install
#    sequence. This is the GitHub Actions convention.) ─────────────────────────

jobs:
  # ── JOB 1: TYPE-CHECK ──────────────────────────────────────────────────────
  # Runs the TypeScript compiler in check-only mode (no output files emitted).
  # Catches type mismatches that ESLint won't catch — e.g. passing a string
  # where a number is expected, or accessing a missing property.
  typecheck:
    name: Type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

  # ── JOB 2: LINT ────────────────────────────────────────────────────────────
  # Runs ESLint (configured in eslint.config.mjs — flat config format).
  # Catches code style issues, unused variables, React rule violations, and
  # other problems that are easy to miss in code review.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  # ── JOB 3: TEST ────────────────────────────────────────────────────────────
  # Runs Vitest unit + integration tests via `npm test`.
  # The npm script maps to: vitest run --project unit
  # This runs the jsdom-environment project only — NOT the storybook browser
  # project (which requires a real browser and is too slow for PR checks).
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

  # ── JOB 4: BUILD ───────────────────────────────────────────────────────────
  # Runs `next build` to compile the entire app for production.
  # Catches errors that only appear at compile time — e.g. a server component
  # importing a client-only module, or a missing page export.
  #
  # ENV VARS: Next.js reads certain env vars at build time. We supply dummy
  # placeholder values here so the build doesn't crash with "missing env var".
  # These are NOT real credentials — the build process only needs them to be
  # *defined*, not to point to a real database or service.
  # Real credentials live in GitHub Secrets and are only used in production.
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: "placeholder"
      DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
      DIRECT_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # ── JOB 5: MIGRATION-CHECK ─────────────────────────────────────────────────
  # Runs `drizzle-kit check` to verify that the schema files in app/db/schema/
  # are consistent with the latest generated migration in the drizzle/ folder.
  #
  # WHY THIS MATTERS:
  # When you edit a schema file (e.g. add a column to users.ts), you must also
  # run `npm run db:generate` to produce a new SQL migration file. If you forget,
  # the schema and migration are out of sync — the app expects a column that
  # doesn't exist in the database yet.
  # This job catches that mistake on every PR before it can reach production.
  migration-check:
    name: Migration check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check migrations are up to date
        run: npx drizzle-kit check
