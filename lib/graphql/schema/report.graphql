enum ReportType {
  portfolio_summary
  asset_allocation
  performance
  tax_summary
  compliance
  client_statement
  custom
}

enum ReportStatus {
  draft
  published
  archived
}

type Report {
  id: ID!
  orgId: ID!
  clientId: ID
  name: String!
  description: String
  reportType: ReportType!
  status: ReportStatus!
  parameters: JSON
  currentVersionId: ID
  currentVersionNumber: Int!
  createdBy: ID
  createdAt: DateTime!
  updatedAt: DateTime!

  # Relations
  client: Client
  createdByUser: User
  versions: [ReportVersion!]!
}

type ReportVersion {
  id: ID!
  reportId: ID!
  versionNumber: Int!
  storagePath: String
  contentHash: String
  parametersSnapshot: JSON
  generatedBy: ID
  generatedAt: DateTime!
  sharedAt: DateTime
  sharedWith: [String!]!
  createdAt: DateTime!

  # Relations
  report: Report!
  generatedByUser: User
}

type ReportConnection {
  items: [Report!]!
  totalCount: Int!
  page: Int!
  limit: Int!
}

input CreateReportInput {
  clientId: ID
  name: String!
  description: String
  reportType: ReportType!
  parameters: JSON
}

input UpdateReportInput {
  name: String
  description: String
  status: ReportStatus
  parameters: JSON
}
