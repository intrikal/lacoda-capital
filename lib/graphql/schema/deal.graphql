enum DealStage {
  prospecting
  due_diligence
  negotiation
  closed
  active
  exit_planning
}

enum DealType {
  real_estate
  private_equity
  venture_capital
  fixed_income
}

type Deal {
  id: ID!
  orgId: ID!
  clientId: ID
  name: String!
  stage: DealStage!
  type: DealType!
  potentialValue: Float!
  probability: Int!
  assignedTo: ID
  assigneeName: String
  dueDate: String
  notes: String
  lastActivity: String
  createdAt: DateTime!
  updatedAt: DateTime!

  # Relations
  client: Client
  assignee: User
}

type DealConnection {
  items: [Deal!]!
  totalCount: Int!
  page: Int!
  limit: Int!
}

input CreateDealInput {
  clientId: ID
  name: String!
  stage: DealStage
  type: DealType!
  potentialValue: Float!
  probability: Int
  assigneeName: String
  dueDate: String
  notes: String
}

input UpdateDealInput {
  clientId: ID
  name: String
  stage: DealStage
  type: DealType
  potentialValue: Float
  probability: Int
  assigneeName: String
  dueDate: String
  notes: String
  lastActivity: String
}
