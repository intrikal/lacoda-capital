enum NotificationType {
  task_assigned
  task_due
  document_uploaded
  document_expiring
  document_requested
  report_ready
  compliance_alert
  system
}

type Notification {
  id: ID!
  userId: ID!
  orgId: ID!
  type: NotificationType!
  title: String!
  message: String
  readAt: DateTime
  payload: JSON
  createdAt: DateTime!

  # Relations
  user: User!
}

type NotificationConnection {
  items: [Notification!]!
  totalCount: Int!
  page: Int!
  limit: Int!
}
