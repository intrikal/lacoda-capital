enum DocumentRequestStatus {
  open
  fulfilled
  cancelled
  overdue
}

type DocumentRequest {
  id: ID!
  orgId: ID!
  clientId: ID
  entityId: ID
  assetId: ID
  title: String!
  description: String
  documentType: String
  status: DocumentRequestStatus!
  priority: TaskPriority!
  dueDate: DateTime
  requestedBy: ID
  assignedTo: ID
  fulfilledAt: DateTime
  fulfilledDocumentId: ID
  metadata: JSON
  createdAt: DateTime!
  updatedAt: DateTime!

  # Relations
  client: Client
  entity: Entity
  asset: Asset
  requestedByUser: User
  assignedToUser: User
}

type DocumentRequestConnection {
  items: [DocumentRequest!]!
  totalCount: Int!
  page: Int!
  limit: Int!
}

input CreateDocumentRequestInput {
  clientId: ID
  entityId: ID
  assetId: ID
  title: String!
  description: String
  documentType: String
  priority: TaskPriority
  dueDate: DateTime
  assignedTo: ID
}

input UpdateDocumentRequestInput {
  title: String
  description: String
  documentType: String
  status: DocumentRequestStatus
  priority: TaskPriority
  dueDate: DateTime
  assignedTo: ID
}
