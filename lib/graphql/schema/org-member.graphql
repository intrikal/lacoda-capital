enum OrgMemberRole {
  admin
  assistant
  client
}

type OrgMember {
  id: ID!
  orgId: ID!
  userId: ID!
  role: OrgMemberRole!
  clientId: ID
  createdAt: DateTime!
  updatedAt: DateTime!

  # Relations
  org: Org!
  user: User!
  client: Client
  assignmentsAsAssistant: [Assignment!]!
}

type OrgMemberConnection {
  items: [OrgMember!]!
  totalCount: Int!
  page: Int!
  limit: Int!
}
