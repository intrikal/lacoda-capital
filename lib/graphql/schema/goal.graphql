type Goal {
  id: ID!
  orgId: ID!
  clientId: ID
  name: String!
  category: String!
  status: String!
  priority: String!
  targetAmount: Float!
  currentAmount: Float!
  monthlyContribution: Float!
  targetDate: String!
  notes: String
  metadata: JSON
  createdAt: DateTime!
  updatedAt: DateTime!

  # Relations
  client: Client
}

type GoalConnection {
  items: [Goal!]!
  totalCount: Int!
  page: Int!
  limit: Int!
}

input CreateGoalInput {
  clientId: ID
  name: String!
  category: String!
  priority: String!
  targetAmount: Float!
  currentAmount: Float
  monthlyContribution: Float
  targetDate: String!
  notes: String
  metadata: JSON
}

input UpdateGoalInput {
  clientId: ID
  name: String
  category: String
  status: String
  priority: String
  targetAmount: Float
  currentAmount: Float
  monthlyContribution: Float
  targetDate: String
  notes: String
  metadata: JSON
}
