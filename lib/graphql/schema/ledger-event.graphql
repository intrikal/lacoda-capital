enum LedgerAction {
  created
  updated
  deleted
  archived
  document_uploaded
  document_verified
  document_expired
  document_downloaded
  asset_valued
  asset_transferred
  asset_sold
  login
  logout
  permission_changed
  report_generated
  report_shared
  compliance_reviewed
  compliance_approved
}

enum LedgerTargetType {
  org
  user
  client
  entity
  asset
  document
  task
  report
}

type LedgerEvent {
  id: ID!
  orgId: ID!
  actorUserId: ID
  targetType: LedgerTargetType!
  targetId: ID!
  action: LedgerAction!
  payload: JSON
  ipAddress: String
  userAgent: String
  createdAt: DateTime!

  # Relations
  actorUser: User
}

type LedgerEventConnection {
  items: [LedgerEvent!]!
  totalCount: Int!
  page: Int!
  limit: Int!
}

input CreateLedgerEventInput {
  targetType: LedgerTargetType!
  targetId: ID!
  action: LedgerAction!
  payload: JSON
}
