type TaxDeduction {
  id: ID!
  orgId: ID!
  clientId: ID!
  name: String!
  category: String!
  type: String!
  status: String!
  amount: Float!
  estimatedSavings: Float!
  taxYear: String!
  description: String
  notes: String
  metadata: JSON
  createdAt: DateTime!
