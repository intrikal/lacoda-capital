type Benchmark {
  id: ID!
  orgId: ID!
  clientId: ID
  name: String!
  symbol: String
  category: String!
  ytdReturn: Float!
  alpha: Float!
  beta: Float!
  sharpeRatio: Float!
  volatility: Float!
  notes: String
  metadata: JSON
  createdAt: DateTime!
  updatedAt: DateTime!
  client: Client
}

type BenchmarkConnection {
  items: [Benchmark!]!
  totalCount: Int!
  page: Int!
  limit: Int!
}

input CreateBenchmarkInput {
  clientId: ID
  name: String!
  symbol: String
  category: String!
  ytdReturn: Float
  alpha: Float
  beta: Float
  sharpeRatio: Float
  volatility: Float
  notes: String
  metadata: JSON
}

input UpdateBenchmarkInput {
  clientId: ID
  name: String
  symbol: String
  category: String
  ytdReturn: Float
  alpha: Float
  beta: Float
  sharpeRatio: Float
  volatility: Float
  notes: String
  metadata: JSON
}
