type Valuation {
  id: ID!
  assetId: ID!
  asOfDate: DateTime!
  value: Float!
  currency: String!
  source: String
  notes: String
  createdAt: DateTime!

  # Relations
  asset: Asset!
}

type ValuationConnection {
  items: [Valuation!]!
  totalCount: Int!
  page: Int!
  limit: Int!
}

input CreateValuationInput {
  assetId: ID!
  asOfDate: DateTime!
  value: Float!
  currency: String
  source: String
  notes: String
}
