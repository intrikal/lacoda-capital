# ============================================================================
# Document GraphQL Schema
# ============================================================================
#
# Defines the Document type, connection, and input types for the Vault feature.
#
# Server handler:  lib/graphql/resolvers/document.ts
# Client queries:  lib/graphql/operations/document.ts
#
# Root registrations in schema.graphql:
#   Query:    documents(...) → DocumentConnection, document(id) → Document
#   Mutation: createDocument, updateDocument, deleteDocument
#
# The `folder` field supports UI folder grouping (e.g., "Real Estate", "Tax").
# Added via migration 0001 as a nullable text column on the documents table.
# ============================================================================

enum DocumentStatus {
  pending
  verified
  expired
  rejected
}

type Document {
  id: ID!
  orgId: ID!
  clientId: ID
  entityId: ID
  assetId: ID
  name: String!
  description: String
  mimeType: String
  fileSize: String
  storagePath: String!
  folder: String
  status: DocumentStatus!
  expiresAt: DateTime
  verifiedAt: DateTime
  verifiedBy: ID
  tags: [String!]!
  metadata: JSON
  createdAt: DateTime!
  updatedAt: DateTime!

  # Relations
  client: Client
  entity: Entity
  asset: Asset
}

type DocumentConnection {
  items: [Document!]!
  totalCount: Int!
  page: Int!
  limit: Int!
}

input CreateDocumentInput {
  clientId: ID
  entityId: ID
  assetId: ID
  name: String!
  description: String
  mimeType: String
  fileSize: String
  storagePath: String!
  folder: String
  status: DocumentStatus
  expiresAt: DateTime
  tags: [String!]
  metadata: JSON
}

input UpdateDocumentInput {
  name: String
  description: String
  folder: String
  status: DocumentStatus
  expiresAt: DateTime
  tags: [String!]
  metadata: JSON
}
