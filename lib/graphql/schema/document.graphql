enum DocumentStatus {
  pending
  verified
  expired
  rejected
}

type Document {
  id: ID!
  orgId: ID!
  clientId: ID
  entityId: ID
  assetId: ID
  name: String!
  description: String
  mimeType: String
  fileSize: String
  storagePath: String!
  status: DocumentStatus!
  expiresAt: DateTime
  verifiedAt: DateTime
  verifiedBy: ID
  tags: [String!]!
  metadata: JSON
  createdAt: DateTime!
  updatedAt: DateTime!

  # Relations
  client: Client
  entity: Entity
  asset: Asset
}

type DocumentConnection {
  items: [Document!]!
  totalCount: Int!
  page: Int!
  limit: Int!
}

input CreateDocumentInput {
  clientId: ID
  entityId: ID
  assetId: ID
  name: String!
  description: String
  mimeType: String
  fileSize: String
  storagePath: String!
  status: DocumentStatus
  expiresAt: DateTime
  tags: [String!]
  metadata: JSON
}

input UpdateDocumentInput {
  name: String
  description: String
  status: DocumentStatus
  expiresAt: DateTime
  tags: [String!]
  metadata: JSON
}
