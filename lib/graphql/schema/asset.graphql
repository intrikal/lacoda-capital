enum AssetClass {
  real_estate
  equities
  fixed_income
  private_equity
  venture_capital
  hedge_funds
  commodities
  cash
  crypto
  collectibles
  intellectual_property
  insurance
  other
}

enum AssetStatus {
  active
  pending
  sold
  transferred
}

type Asset {
  id: ID!
  entityId: ID!
  name: String!
  description: String
  assetClass: AssetClass!
  status: AssetStatus!
  acquisitionDate: DateTime
  acquisitionCost: Float
  currency: String!
  currentValue: Float
  valuedAt: DateTime
  externalId: String
  metadata: JSON
  createdAt: DateTime!
  updatedAt: DateTime!

  # Relations
  entity: Entity!
  valuations: [Valuation!]!
  documents: [Document!]!
  tasks: [Task!]!

  # Computed
  latestValuation: Valuation
}

type AssetConnection {
  items: [Asset!]!
  totalCount: Int!
  page: Int!
  limit: Int!
}

input CreateAssetInput {
  entityId: ID!
  name: String!
  description: String
  assetClass: AssetClass!
  status: AssetStatus
  acquisitionDate: DateTime
  acquisitionCost: Float
  currency: String
  currentValue: Float
  externalId: String
  metadata: JSON
}

input UpdateAssetInput {
  name: String
  description: String
  assetClass: AssetClass
  status: AssetStatus
  acquisitionDate: DateTime
  acquisitionCost: Float
  currency: String
  currentValue: Float
  externalId: String
  metadata: JSON
}
