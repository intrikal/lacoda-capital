type BillingRecord {
  id: ID!
  orgId: ID!
  clientId: ID!
  period: String!
  amount: Float!
  aum: Float!
  status: String!
  dueDate: String!
  paidDate: String
  effectiveRate: Float!
  description: String
  notes: String
  metadata: JSON
  createdAt: DateTime!
  updatedAt: DateTime!
  client: Client
}

type BillingRecordConnection {
  items: [BillingRecord!]!
  totalCount: Int!
  page: Int!
  limit: Int!
}

input CreateBillingRecordInput {
  clientId: ID!
  period: String!
  amount: Float!
  aum: Float
  status: String
  dueDate: String!
  paidDate: String
  effectiveRate: Float!
  description: String
  notes: String
  metadata: JSON
}

input UpdateBillingRecordInput {
  clientId: ID
  period: String
  amount: Float
  aum: Float
  status: String
  dueDate: String
  paidDate: String
  effectiveRate: Float
  description: String
  notes: String
  metadata: JSON
}
